<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#19778a" />
    <title>Sin conexión · Casita de Juana</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #fbf7ee;
        color: #10242b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 120px; height: 120px; }
      h1 { margin: 16px 0 4px; font-size: 1.5rem; color: #19778a; }
      p { margin: 4px 0; line-height: 1.45; }
      .en { color: #5b6b70; font-size: 0.95rem; }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: #19778a;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo.png" alt="Casita de Juana" />
      <h1>Sin conexión</h1>
      <p>Revise su internet y vuelva a intentarlo.</p>
      <p class="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Reintentar · Try again</button>
    </main>
  </body>
</html>
