# Daily billing job (monthly rent, late fees, USD/DOP rate) for hosts without free cron jobs, such as Render.
# Needs the repository secret CRON_SECRET (the same value the host uses). Set the repository variable
# APP_URL if the site is not at https://casita-de-juana.onrender.com.
# Billing also runs whenever the owner or a tenant opens the app, so a missed day is caught up later.
name: Daily billing

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 05:00 in Santo Domingo
  workflow_dispatch:

permissions: {}

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the billing endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://casita-de-juana.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in the repository secrets - skipping."
            exit 0
          fi
          # Render's free plan sleeps when idle; the first request can take about a minute to wake it.
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/billing"
