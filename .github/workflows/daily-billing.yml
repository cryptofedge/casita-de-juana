# Daily billing job (monthly rent, late fees, USD/DOP rate) for hosts without a built-in cron, such as Netlify.
# Needs the repository variable APP_URL (the site's address) and the repository secret CRON_SECRET (the same
# value the site uses). Until both are set it skips with a warning.
# Billing also runs whenever the owner or a tenant opens the app, so a missed day is caught up later.
name: Daily billing

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 05:00 in Santo Domingo
  workflow_dispatch:

permissions: {}

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the billing endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Set the repository variable APP_URL and the secret CRON_SECRET to enable daily billing - skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/billing"
