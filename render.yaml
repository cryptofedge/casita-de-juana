# Render Blueprint: runs the app on Render's free plan.
# The database stays on Neon (the same one the Vercel deployment used), so no data moves.
# Set up: Render Dashboard > New > Blueprint > pick this repo. Render asks for the two database
# URLs (sync: false) and generates AUTH_SECRET and CRON_SECRET itself. See README "Deploy on Render".
services:
  - type: web
    name: casita-de-juana
    runtime: node
    plan: free
    region: virginia # US East: closest to the Dominican Republic; keep it near the Neon database
    branch: master
    # --include=dev: the build needs the Prisma CLI, TypeScript and Tailwind, which are dev dependencies.
    buildCommand: npm ci --include=dev && node scripts/deploy-build.mjs
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /manifest.webmanifest
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL # Neon pooled connection string (its host contains "-pooler")
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct connection string (used for schema updates)
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET # copy this value into the GitHub repository secret CRON_SECRET (daily billing)
        generateValue: true
